<div class="newsletter-signup-widget card p-3">
  <h5>Sign Up for Zoo Updates</h5>
  <p class="small text-muted">Get our latest state zoo guides, seasonal ticket discount alerts, and family accessibility tips.</p>
  <form action="/contact" method="GET">
    <div class="form-group mb-2">
      <label for="newsletter-email" class="sr-only">Email address</label>
      <input type="email" id="newsletter-email" name="email" class="form-control form-control-sm" placeholder="Enter your email address" required>
    </div>
    <button type="submit" class="btn btn-primary btn-sm btn-block">Subscribe</button>
  </form>
</div>
